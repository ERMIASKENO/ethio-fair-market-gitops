# PostgreSQL for the services, managed by the CloudNativePG operator (installed by platform-kit).
# One database + one login role per service ("database per service" pattern).
# Role passwords come from Secrets created by deploy-kit/2-secrets.sh (never stored in Git).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: efm-pg
  namespace: efm-data
spec:
  description: ethio-fair-market service databases
  instances: 1
  enablePDB: false            # single instance: a PDB would block node drains during upgrades
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: local-retain  # data disk on k8s-worker-2, kept even if the PVC is deleted
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
      log_min_duration_statement: "500ms"   # log slow queries
  affinity:
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-2
  managed:
    roles:
      - name: identity
        ensure: present
        login: true
        connectionLimit: 30
        passwordSecret: { name: efm-pg-identity }
      - name: listings
        ensure: present
        login: true
        connectionLimit: 30
        passwordSecret: { name: efm-pg-listings }
