# Only the efm services, the operator, Prometheus and the instances themselves may reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efm-pg-ingress
  namespace: efm-data
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: efm-pg }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: efm }
      ports: [{ port: 5432, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports: [{ port: 8000, protocol: TCP }, { port: 5432, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 9187, protocol: TCP }]
    - from:
        - podSelector:
            matchLabels: { cnpg.io/cluster: efm-pg }
