# Prometheus scrapes the PostgreSQL exporter built into every CloudNativePG instance.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: efm-pg
  namespace: efm-data
spec:
  selector:
    matchLabels: { cnpg.io/cluster: efm-pg }
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
