{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ms.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    {{- toYaml (required "route.hostnames is required when route.enabled" .Values.route.hostnames) | nindent 4 }}
  rules:
    - matches:
        {{- range (required "route.pathPrefixes is required when route.enabled" .Values.route.pathPrefixes) }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ include "ms.name" . }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.route.timeout }}
{{- end }}
