apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ms.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: {{ .Values.service.appProtocol }}
