# Every change to this repo is checked before Argo CD applies it:
#   helm lint + render every service, kustomize build the platform, schema-validate everything (incl. CRDs)
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUBERNETES_VERSION: 1.34.0
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: helm lint + template (dev services)
        run: |
          set -euo pipefail
          mkdir -p rendered
          for f in environments/dev/services/*.yaml; do
            svc=$(basename "$f" .yaml)
            helm lint charts/microservice -f environments/dev/values-common.yaml -f "$f" --strict
            helm template "$svc" charts/microservice -n efm -f environments/dev/values-common.yaml -f "$f" > "rendered/svc-$svc.yaml"
          done
      - name: kustomize build (platform overlays)
        run: |
          set -euo pipefail
          for o in platform/overlays/*/; do
            kubectl kustomize "$o" > "rendered/platform-$(basename "$o").yaml"
          done
      - name: schema validation (Kubernetes + CRDs)
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml argocd/*.yaml bootstrap/*.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-manifests
          path: rendered/
